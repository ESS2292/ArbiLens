services:
  frontend:
    build:
      context: ../frontend
    env_file:
      - ../frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    command: celery -A app.workers.celery_worker.celery_app worker --loglevel=info
    # The image healthcheck probes the API port. This process is the worker.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      s3-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arbilens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arbilens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # minio/minio is not pullable here (Docker Hub denies the repo; quay.io returns 401).
  # adobe/s3mock speaks the S3 API on port 9090. Its initialBuckets setting did not
  # create the bucket in the image we could pull, so s3-init does that explicitly.
  s3:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"

  s3-init:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    entrypoint: ["python", "-m", "app.ensure_bucket"]
    depends_on:
      s3:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
